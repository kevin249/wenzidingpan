<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
    <title>行情组件设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <section class="field">
        <label for="provider">数据源</label>
        <select id="provider"></select>
        <p class="hint" id="provider-hint"></p>
      </section>

      <section class="field">
        <label for="symbols">自选股票</label>
        <textarea id="symbols" rows="6" spellcheck="false"></textarea>
        <p class="hint">
          每行一个，或用逗号分隔，最多 50 只。可写 <code>600519</code>、<code>sh600519</code>
          或 <code>600519.SH</code>，交易所前缀会自动补全。示例：<span id="symbols-hint"></span>
        </p>
      </section>

      <section class="field row">
        <div>
          <label for="layout">显示模式</label>
          <select id="layout">
            <option value="multi">多行列表</option>
            <option value="single">单行滚动</option>
          </select>
        </div>
        <div>
          <label for="rows">显示行数</label>
          <input id="rows" type="number" min="1" max="30" step="1" />
        </div>
      </section>
      <p class="hint" id="layout-hint"></p>

      <section class="field row">
        <div>
          <label for="font-family">字体</label>
          <input id="font-family" type="text" list="font-presets" placeholder="跟随系统" spellcheck="false" />
          <datalist id="font-presets">
            <option value="PingFang SC"></option>
            <option value="Microsoft YaHei"></option>
            <option value="Noto Sans SC"></option>
            <option value="Source Han Sans SC"></option>
            <option value="SimHei"></option>
            <option value="ui-monospace, Menlo, Consolas"></option>
          </datalist>
        </div>
        <div>
          <label for="font-size">字号（px）</label>
          <input id="font-size" type="number" min="9" max="28" step="1" />
        </div>
      </section>
      <p class="hint">字体留空表示跟随系统；可直接填写系统里已安装的字体名。</p>

      <section class="field row">
        <div>
          <label for="refresh">刷新间隔（秒）</label>
          <input id="refresh" type="number" min="1" max="3600" step="1" />
        </div>
        <div>
          <label for="scheme">涨跌配色</label>
          <select id="scheme">
            <option value="cn">红涨绿跌（A 股）</option>
            <option value="us">绿涨红跌（欧美）</option>
          </select>
        </div>
      </section>

      <section class="field">
        <label for="opacity">窗口透明度 <span class="value" id="opacity-value"></span></label>
        <input id="opacity" type="range" min="0.2" max="1" step="0.05" />
      </section>

      <section class="field checks">
        <label><input id="ontop" type="checkbox" /> 最前显示（始终置于所有窗口之上）</label>
        <label><input id="darktrade" type="checkbox" /> 显示东方财富暗盘资金</label>
        <label><input id="spark" type="checkbox" /> 显示迷你走势图</label>
        <label><input id="compact" type="checkbox" /> 紧凑模式</label>
      </section>

      <footer class="bar">
        <span class="saved" id="saved"></span>
        <button id="apply" class="primary">保存并应用</button>
      </footer>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
